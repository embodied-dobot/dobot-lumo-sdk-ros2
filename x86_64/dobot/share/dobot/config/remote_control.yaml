# Aligned with firmware dobot_fastdds_config.xml: BEST_EFFORT + VOLATILE + KEEP_LAST depth 1.
# heartbeat_period_ms: 1000
# serialization: xcdr1
# The underlying DDS topic name is this topic prefixed with rt/. For example, this file corresponds to rt/remote/control.
# ROS 2 users subscribe with the name without rt/. The rmw layer adds rt/ again on ROS_DOMAIN_ID.
/remote/control:
  subscription:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 1
  publisher:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 1
