# Aligned with firmware dobot_fastdds_config.xml: RELIABLE + VOLATILE + KEEP_LAST depth 1.
# heartbeat_period_ms: 1000
# serialization: xcdr1
# The underlying DDS topic name is this topic prefixed with rt/. For example, this file corresponds to rt/set/fsm/id.
# ROS 2 users subscribe with the name without rt/. The rmw layer adds rt/ again on ROS_DOMAIN_ID.
/set/fsm/id:
  subscription:
    reliability: reliable
    durability: volatile
    history: keep_last
    depth: 1
  publisher:
    reliability: reliable
    durability: volatile
    history: keep_last
    depth: 1
